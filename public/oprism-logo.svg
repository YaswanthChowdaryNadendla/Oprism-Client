<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="prismGrad1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="prismGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="prismGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Modern Geometric Prism facets -->
  <polygon points="50,14 84,34 50,54 16,34" fill="url(#prismGrad1)" opacity="0.95" />
  <polygon points="16,34 50,54 50,88 16,68" fill="url(#prismGrad2)" opacity="0.8" />
  <polygon points="84,34 50,54 50,88 84,68" fill="url(#prismGrad1)" opacity="0.65" />
  <!-- Inner crystal refraction accent -->
  <path d="M50,22 L76,37 L50,50 L24,37 Z" fill="#ffffff" opacity="0.35" />
</svg>
